
# Server Configuration
server.port=8080

# Kafka Configuration
kafka.bootstrap.servers=localhost:9092,localhost:9094,localhost:9096
kafka.client.dns.lookup=use_all_dns_ips
kafka.client.rack=zone-b

# Consumer configs
kafka.enable.auto.commit=false
kafka.auto.offset.reset=earliest
kafka.fetch.max.wait.ms=500
kafka.fetch.min.bytes=1
kafka.max.poll.records=500
kafka.request.timeout.ms=10000
kafka.session.timeout.ms=20000
kafka.heartbeat.interval.ms=5000
kafka.connections.max.idle.ms=300000
kafka.metadata.max.age.ms=180000

# Producer configs
kafka.producer.acks=1
kafka.producer.batch.size=16384
kafka.producer.linger.ms=0
kafka.producer.pool.size=10
kafka.producer.max.requests.per.second=1000
kafka.producer.client.id.prefix=kafka-producer


# Reader configs
kafka.read.poll.timeout.ms=200
kafka.read.max.retries=3

# Logging
logging.level.org.apache.kafka.clients.consumer=ERROR
logging.level.org.apache.kafka.clients.Metadata=ERROR
logging.level.org.apache.kafka.clients.FetchSessionHandler=ERROR
logging.level.org.apache.kafka.clients.NetworkClient=ERROR
logging.level.org.apache.kafka.common.network.Selector=ERROR
logging.level.org.apache.kafka.clients.consumer.internals.Fetcher=DEBUG
logging.level.org.apache.kafka.clients.FetchSessionHandler=INFO
logging.level.org.apache.kafka.clients.consumer.internals.ConsumerCoordinator=INFO